version: '3.8'

services:
  sw-gen:
    build: .
    container_name: savage-worlds-generator
    ports:
      - "5000:5000"
    volumes:
      # Монтируем директорию с персонажами для сохранения данных
      - ./characters:/app/characters
      # Монтируем JSON файлы данных (опционально, для возможности редактирования)
      - ./flaws.json:/app/flaws.json
      - ./skills.json:/app/skills.json
      - ./traits.json:/app/traits.json
      - ./races.json:/app/races.json
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
