<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонаж</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="char-name">Загрузка...</h1>
        </header>
        <div class="character-view" id="character-view">
            <p>Загрузка данных персонажа...</p>
        </div>
        <div class="action-buttons">
            <a href="/" class="btn btn-secondary">Назад к созданию</a>
        </div>
    </div>
    <script>
        const charUuid = '{{ char_uuid }}';
        fetch(`/api/character/${charUuid}`)
            .then(res => res.json())
            .then(character => {
                document.getElementById('char-name').textContent = character.concept.name || 'Безымянный персонаж';
                document.getElementById('character-view').innerHTML = `
                    <section class="section">
                        <h2>Описание</h2>
                        <p>${character.concept.description || 'Нет описания'}</p>
                    </section>
                    <section class="section">
                        <h2>Характеристики</h2>
                        <div class="characteristics-grid">
                            ${Object.keys(character.characteristics).filter(k => !k.includes('total')).map(key => `
                                <div class="char-item">
                                    <label>${key.charAt(0).toUpperCase() + key.slice(1)}</label>
                                    <div class="char-value">${character.characteristics[key].value}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                    <section class="section">
                        <h2>Навыки</h2>
                        <div class="skills-grid">
                            ${character.skills.map(skill => `
                                <div class="skill-item">
                                    <div class="skill-name">${skill.name}</div>
                                    <div class="skill-value">${skill.value}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                    <section class="section">
                        <h2>Изъяны</h2>
                        <div class="flaws-list">
                            ${character.starting_flaws.map(flaw => `
                                <div class="flaw-item">
                                    <div class="flaw-name">${flaw.name}</div>
                                    <div class="flaw-points">${flaw.points} пункт${flaw.points > 1 ? 'а' : ''}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                    <section class="section">
                        <h2>Черты</h2>
                        <div class="traits-list">
                            ${character.starting_traits.map(trait => `
                                <div class="trait-item">
                                    <div class="trait-name">${trait.name}</div>
                                    <div class="trait-category">${trait.category_en}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            })
            .catch(err => {
                document.getElementById('character-view').innerHTML = '<p>Ошибка загрузки персонажа</p>';
            });
    </script>
</body>
</html>
